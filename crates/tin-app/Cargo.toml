[package]
name = "tin-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tin-app"
path = "src/main.rs"

[dependencies]
tin-core = { path = "../tin-core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "eff95e80c328943deeeef0355485c06c3d71ecf0" }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2"
evdev = "0.13.2"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["xkbcommon"] }
wayland-client = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5.3"
