[package]
name = "tin-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tin-app"
path = "src/main.rs"

[dependencies]
tin-core = { path = "../tin-core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "eff95e80c328943deeeef0355485c06c3d71ecf0" }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5.3"
