[workspace]
resolver = "3"
members = ["crates/tin-core", "crates/tin", "crates/tin-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AugusDogus/tin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# The picker draws whole monitors in software; keep Tin's own crates fast in debug builds too.
[profile.dev.package.tin-app]
opt-level = 2

[profile.dev.package.tin-core]
opt-level = 2

[profile.dev.package.ab_glyph_rasterizer]
opt-level = 2
