name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Package
        run: |
          mkdir -p dist/tin-${{ matrix.name }}
          cp target/release/tin target/release/tin-app README.md LICENSE dist/tin-${{ matrix.name }}/
          tar -C dist -czf dist/tin-${{ matrix.name }}.tar.gz tin-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: tin-${{ matrix.name }}
          path: dist/tin-${{ matrix.name }}.tar.gz

  extension:
    name: Browser extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test extension/test/*.test.mjs
      - name: Package
        run: |
          mkdir -p dist
          cd extension && zip -r ../dist/tin-extension.zip . -x 'test/*'
      - uses: actions/upload-artifact@v4
        with:
          name: tin-extension
          path: dist/tin-extension.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
